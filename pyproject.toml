[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-repo-cloner"
dynamic = ["version"]
description = "Clone and safely update GitHub and Bitbucket repositories the same way on every PC"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["git", "github", "bitbucket", "clone", "automation"]
dependencies = []

[project.scripts]
repo-cloner = "repo_cloner:main"

[tool.setuptools]
py-modules = ["repo_cloner", "repo_cloner_tui", "repo_cloner_progress"]

[tool.setuptools.dynamic]
version = {attr = "repo_cloner.__version__"}
