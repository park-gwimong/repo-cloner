name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      # Report every OS/Python result instead of cancelling the rest on the first failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
      - name: Report failed tests as annotations
        if: failure()
        shell: bash
        run: python .github/scripts/report_test_failures.py test-output.txt
      - run: python -m pip install .
      - run: repo-cloner --help
      - run: repo-cloner --version
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(python -c 'import repo_cloner; print(repo_cloner.__version__)')"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
